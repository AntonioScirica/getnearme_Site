# Supabase configuration
# Only lists functions that need a non-default verify_jwt. Functions not
# listed here keep whatever setting is already configured in the dashboard —
# this file must never be extended to cover create-batch-staging /
# process-batch-staging without first confirming their current dashboard
# setting, since they're not in any local config today.

[functions.generate-blog-post]
verify_jwt = false

[functions.quality-check-blog-post]
verify_jwt = false

[functions.publish-blog-posts]
verify_jwt = false

[functions.analyze-blog-performance]
verify_jwt = false
