<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anteprima Template - SocialShowcase</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #f5f5f5; font-family: 'Poppins', sans-serif; padding: 32px; }
h1 { text-align: center; font-size: 24px; margin-bottom: 8px; color: #1a1a2e; }
.subtitle { text-align: center; font-size: 14px; color: #666; margin-bottom: 32px; }
.grid {
  display: flex; flex-wrap: wrap; gap: 24px; justify-content: center;
}
.tpl-wrap {
  display: flex; flex-direction: column; align-items: center; gap: 8px;
}
.tpl-label { font-size: 13px; font-weight: 600; color: #333; }
.tpl-card {
  width: 300px; height: 375px; border-radius: 12px; overflow: hidden;
  box-shadow: 0 4px 16px rgba(0,0,0,0.15); position: relative;
}
.tpl-card img.bg {
  position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
}

/* Badge variants */
.badge {
  display: inline-flex; align-items: center; justify-content: center;
  padding: 5px 10px; border-radius: 3px; font-size: 10px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.4px; white-space: nowrap;
  font-family: 'Poppins', sans-serif; line-height: 1;
}
.badge-white { background: #fff; color: #2967EC; }
.badge-blue { background: #2967EC; color: #fff; }
.badge-outline { background: transparent; color: #fff; border: 1px solid #fff; }

/* Address with pin */
.address {
  display: flex; align-items: center; gap: 4px; font-family: 'Poppins', sans-serif;
}
.address span { font-size: 8px; font-weight: 500; }

/* Glass metrics */
.glass-metrics { display: flex; gap: 4px; width: 100%; }
.glass-metric {
  flex: 1; background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.35);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  border-radius: 6px; padding: 4% 0; display: flex; flex-direction: column;
  align-items: center; gap: 4px; font-family: 'Poppins', sans-serif;
  min-height: 44px;
}
.glass-metric .val { font-size: 12px; font-weight: 400; color: #fff; }

/* Dark metrics (Card/TopBar) */
.dark-metrics { display: flex; gap: 4px; width: 100%; }
.dark-metric {
  flex: 1; border: 1px solid #ccc; border-radius: 6px; padding: 3% 0;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
}
.dark-metric .val { font-size: 12px; font-weight: 400; color: #000; }

/* Horizontal metric pills */
.metric-pills { display: flex; gap: 6px; }
.metric-pill {
  background: rgba(255,255,255,0.2); backdrop-filter: blur(10px);
  border-radius: 8px; border: 1px solid rgba(255,255,255,0.3);
  padding: 4px 12px; display: flex; align-items: center; gap: 4px;
}
.metric-pill .val { font-size: 10px; color: #fff; font-weight: 600; }

/* Split horizontal pills */
.split-pills { display: flex; gap: 3px; }
.split-pill {
  background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.2);
  border-radius: 4px; padding: 2.5% 3%; display: flex; align-items: center; gap: 4px;
}
.split-pill .val { font-size: 10px; color: #fff; font-weight: 400; }
</style>
</head>
<body>
<h1>Anteprima Template SocialShowcase</h1>
<p class="subtitle">Stessi template che appaiono nel marquee del sito — dimensione 300×375px</p>

<div class="grid" id="grid"></div>

<script>
const PHOTO = 'https://images.unsplash.com/photo-1600585154340-be6161a56a0c?w=600&h=750&fit=crop';
const AC = '#2967EC';
const D = {
  badge: 'NUOVO',
  price: '€ 1.850.000',
  title: 'Appartamento',
  address: 'Milano, Porta Nuova',
  desc: 'Informazioni organizzate per aiutarti a confrontare immobili e contesto in modo strutturato.',
  metrics: ['3', '2', '110 m²'],
  metricsInline: '3 camere | 2 bagni | 110 m²',
};

// SVG icons (exact paths from GetNearMe/sidepanel/templates/icons.js)
const svgBed = (size, color) => `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 20v-8a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v8"/><path d="M4 10V6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v4"/><path d="M12 4v6"/><path d="M2 18h20"/></svg>`;
const svgBath = (size, color) => `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5 L 7.621 3.621A2.121 2.121 0 0 0 4 5v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-5"/><path d="M2 12h20"/><path d="M10 4 L 8 6"/><path d="M7 19v2"/><path d="M17 19v2"/></svg>`;
const svgArea = (size, color) => `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6"/><path d="M9 21H3v-6"/><path d="M21 3l-7 7"/><path d="M3 21l7-7"/></svg>`;
const svgPin = (size, color) => `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/></svg>`;
const svgChevron = (size, color) => `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>`;

const metricIcons = [svgBed, svgBath, svgArea];

function badge(variant, extraStyle = '') {
  return `<div class="badge badge-${variant}" style="${extraStyle}">${D.badge}</div>`;
}

function address(color = 'rgba(255,255,255,0.8)') {
  return `<div class="address">${svgPin(8, color)}<span style="font-size:8px;color:${color};font-weight:500">${D.address}</span></div>`;
}

function glassMetrics() {
  return `<div class="glass-metrics">${D.metrics.map((v, i) =>
    `<div class="glass-metric"><span class="val">${v}</span>${metricIcons[i](10, '#fff')}</div>`
  ).join('')}</div>`;
}

function darkMetrics() {
  return `<div class="dark-metrics">${D.metrics.map((v, i) =>
    `<div class="dark-metric"><span class="val">${v}</span>${metricIcons[i](10, '#000')}</div>`
  ).join('')}</div>`;
}

function metricPills() {
  return `<div class="metric-pills">${D.metrics.map((v, i) =>
    `<div class="metric-pill">${metricIcons[i](8, '#fff')}<span class="val">${v}</span></div>`
  ).join('')}</div>`;
}

function splitPills() {
  return `<div class="split-pills">${D.metrics.map((v, i) =>
    `<div class="split-pill">${metricIcons[i](8, '#fff')}<span class="val">${v}</span></div>`
  ).join('')}</div>`;
}

const bg = `<img class="bg" src="${PHOTO}" alt="">`;

const templates = {
  Gradient: `
    ${bg}
    <div style="position:absolute;inset:0;background:linear-gradient(to bottom, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0.5) 50%, rgba(0,0,0,0.8) 100%)"></div>
    <div style="position:absolute;inset:0;padding:4.5%;display:flex;flex-direction:column;justify-content:space-between;z-index:2">
      <div style="background:rgba(255,255,255,0.12);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.25);border-radius:8px;padding:5%;position:relative">
        ${badge('white', 'position:absolute;top:12%;left:5%')}
        <div style="margin-top:40px;font-size:18px;font-weight:600;color:#fff;line-height:1.2">${D.title}</div>
        <div style="margin-top:4px">${address()}</div>
        <div style="font-size:26px;font-weight:600;color:#fff;margin-top:6px">${D.price}</div>
      </div>
      <div style="display:flex;flex-direction:column;gap:5px">
        ${glassMetrics()}
        <div style="background:rgba(255,255,255,0.12);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.25);border-radius:8px;padding:4%">
          <div style="font-size:8px;color:#fff;line-height:1.4">${D.desc}</div>
        </div>
      </div>
    </div>`,

  Blue: `
    ${bg}
    <div style="position:absolute;inset:0;background:radial-gradient(ellipse at 86% 9%, rgba(41,103,236,0) 0%, rgba(41,103,236,0.8) 50%, rgba(41,103,236,0.8) 100%)"></div>
    ${badge('blue', 'position:absolute;top:5%;right:5%;z-index:3')}
    <div style="position:absolute;inset:0;padding:5%;display:flex;flex-direction:column;justify-content:flex-end;z-index:2">
      <div style="font-size:30px;font-weight:600;color:#fff">${D.price}</div>
      <div style="margin-top:4px">${address()}</div>
      <div style="margin-top:10px">${glassMetrics()}</div>
      <div style="font-size:15px;font-weight:600;color:#fff;margin-top:10px;line-height:1.3">${D.title}</div>
      <div style="font-size:8px;color:#fff;line-height:1.4;margin-top:4px">${D.desc}</div>
      <div style="margin-top:8px;background:#fff;color:${AC};border-radius:6px;padding:5px 16px;display:inline-flex;align-items:center;gap:4px;align-self:flex-start">
        <span style="font-size:10px;font-weight:600">Contattaci ora</span>
        ${svgChevron(8, AC)}
      </div>
    </div>`,

  Diagonal: `
    ${bg}
    <div style="position:absolute;inset:0;background:${AC};clip-path:polygon(0 0, 100% 0, 100% 25%, 0 55%);z-index:1"></div>
    <div style="position:absolute;bottom:0;left:0;right:0;height:40%;background:linear-gradient(to bottom, transparent, rgba(0,0,0,0.9));z-index:1"></div>
    <div style="position:absolute;inset:0;padding:5%;display:flex;flex-direction:column;justify-content:space-between;z-index:2">
      <div>
        ${badge('white', 'margin-bottom:8px')}
        <div style="font-size:26px;font-weight:600;color:#fff">${D.price}</div>
        <div style="font-size:15px;font-weight:600;color:#fff;margin-top:6px;line-height:1.2;max-width:60%">${D.title}</div>
        <div style="margin-top:4px">${address()}</div>
      </div>
      <div style="display:flex;flex-direction:column;gap:8px">
        ${glassMetrics()}
        <div style="font-size:8px;color:#fff;line-height:1.4">${D.desc}</div>
      </div>
    </div>`,

  Centered: `
    ${bg}
    <div style="position:absolute;inset:0;background:rgba(0,0,0,0.6)"></div>
    <div style="position:absolute;inset:0;padding:5%;display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center;z-index:2">
      ${badge('white')}
      <div>
        <div style="font-size:26px;font-weight:600;color:#fff">${D.price}</div>
        <div style="font-size:14px;font-weight:600;color:#fff;margin-top:4px">${D.title}</div>
        <div style="margin-top:10px">${glassMetrics()}</div>
        <div style="font-size:8px;color:#fff;line-height:1.4;margin-top:8px">${D.desc}</div>
      </div>
      ${address()}
    </div>`,

  Card: `
    ${bg}
    <div style="position:absolute;inset:0;background:linear-gradient(180deg, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0.5) 53%, rgba(0,0,0,0.8) 100%)"></div>
    <div style="position:absolute;top:5%;left:5%;right:5%;display:flex;justify-content:space-between;z-index:3">
      <div style="background:#fff;border-radius:6px;padding:5px 12px;display:flex;align-items:center">
        <span style="font-size:16px;font-weight:600;color:#000">${D.price}</span>
      </div>
      ${badge('blue', 'border-radius:6px;padding:5px 16px;font-size:12px')}
    </div>
    <div style="position:absolute;bottom:5%;left:5%;right:5%;background:#fff;border-radius:6px;padding:5% 8%;display:flex;flex-direction:column;align-items:center;text-align:center;z-index:2">
      <div style="font-size:14px;font-weight:600;color:#000">${D.title}</div>
      <div style="margin-top:6px">${address('#6b7280')}</div>
      <div style="margin-top:14px;width:100%">${darkMetrics()}</div>
      <div style="font-size:8px;color:#6e6e6e;margin-top:14px;line-height:1.4">${D.desc}</div>
    </div>`,

  Elegant: `
    ${bg}
    <div style="position:absolute;inset:0;background:linear-gradient(180deg, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0.5) 53%, rgba(0,0,0,0.8) 100%)"></div>
    <div style="position:absolute;inset:0;padding:5%;display:flex;flex-direction:column;justify-content:space-between;z-index:2">
      ${badge('outline', 'font-weight:400;align-self:flex-start')}
      <div>
        <div style="font-size:14px;font-weight:400;color:#fff;line-height:1.3">${D.title}</div>
        <div style="font-size:26px;font-weight:600;color:#fff;margin-top:8px">${D.price}</div>
        <div style="width:100%;height:1px;background:rgba(255,255,255,0.3);margin:12px 0"></div>
        <div style="font-size:9px;color:#fff;font-weight:400">${D.metricsInline}</div>
      </div>
    </div>`,

  TopBar: `
    ${bg}
    <div style="position:absolute;inset:0;background:linear-gradient(180deg, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0.5) 53%, rgba(0,0,0,0.8) 100%)"></div>
    <div style="position:absolute;top:14.4%;bottom:14.4%;left:7%;right:7%;background:#fff;border-radius:8px;display:flex;flex-direction:column;align-items:center;padding:10% 6% 7%;text-align:center;z-index:2;overflow:hidden;box-sizing:border-box">
      <div style="font-size:30px;font-weight:600;color:#000;margin-top:10px">${D.price}</div>
      <div style="font-size:14px;font-weight:600;color:#000;margin-top:6px">${D.title}</div>
      <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%">
        ${darkMetrics()}
        <div style="font-size:8px;color:#6e6e6e;margin-top:10px;line-height:1.4">${D.desc}</div>
      </div>
      ${address('#000')}
    </div>
    ${badge('blue', 'position:absolute;top:calc(14.4% - 4%);left:50%;transform:translateX(-50%);z-index:3;border-radius:6px;padding:5px 20px;font-size:12px')}`,

  Clean: `
    ${bg}
    <div style="position:absolute;inset:0;background:linear-gradient(180deg, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0.5) 53%, rgba(0,0,0,0.8) 100%)"></div>
    <div style="position:absolute;top:4.7%;left:5.9%;right:5.9%;height:26px;background:rgba(255,255,255,0.2);border-radius:6px;border:1px solid #fff;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:space-between;padding:0 4px 0 7px;box-sizing:border-box;z-index:2">
      <div style="display:flex;align-items:center;gap:4px;overflow:hidden;flex:1;min-width:0">
        ${svgPin(7, '#fff')}
        <span style="font-size:8px;color:#fff;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${D.address}</span>
      </div>
      ${badge('white', 'margin-left:4px;flex-shrink:0;border-radius:4px;padding:3px 8px;font-size:9px')}
    </div>
    <div style="position:absolute;bottom:5%;left:5.9%;right:5.9%;z-index:2">
      <div class="metric-pills">
        ${D.metrics.map((v, i) =>
          `<div class="metric-pill" style="height:24px;padding:0 8px">${metricIcons[i](9, '#fff')}<span class="val" style="white-space:nowrap">${v}</span></div>`
        ).join('')}
      </div>
      <div style="font-size:18px;font-weight:600;color:#fff;margin-top:8px;line-height:1.2">${D.title}</div>
    </div>`,

  Fade: `
    ${bg}
    <div style="position:absolute;inset:0;background:linear-gradient(90deg, ${AC} 0%, ${AC}CC 35%, transparent 70%)"></div>
    ${badge('white', 'position:absolute;top:5%;left:5%;z-index:3')}
    <div style="position:absolute;bottom:5%;left:5%;max-width:50%;z-index:2">
      <div style="font-size:24px;font-weight:700;color:#fff">${D.price}</div>
      <div style="font-size:18px;font-weight:700;color:#fff;margin-top:4px;line-height:1.2">${D.title}</div>
      <div style="margin-top:4px">${address()}</div>
      <div style="font-size:8px;color:rgba(255,255,255,0.85);margin-top:6px;line-height:1.3">${D.desc}</div>
      <div style="margin-top:8px;border:1px solid rgba(255,255,255,0.7);border-radius:20px;padding:6px 12px;display:flex;align-items:center;justify-content:center;width:100%;box-sizing:border-box">
        <span style="font-size:8px;color:#fff;letter-spacing:1px;text-align:center;white-space:nowrap">${D.metricsInline}</span>
      </div>
    </div>`,

  Arch: `
    <div style="position:relative;width:100%;height:100%;background:#fff;overflow:hidden">
      <div style="position:absolute;left:0;right:0;bottom:0;height:50%;background:${AC}"></div>
      <div style="position:absolute;top:5%;left:5%;right:5%;display:flex;flex-direction:column;align-items:center;text-align:center;z-index:2">
        ${badge('blue')}
        <div style="font-size:18px;font-weight:700;color:#1C1C1C;margin-top:6px;line-height:1.15">${D.title}</div>
        <div style="font-size:16px;font-weight:700;color:${AC};margin-top:6px">${D.price}</div>
        <div style="display:flex;align-items:center;gap:6px;margin-top:8px">
          ${D.metrics.map((v, i) => (i > 0 ? `<div style="width:1px;height:12px;background:#ccc"></div>` : '') + `${metricIcons[i](8, '#444')}<span style="font-size:10px;color:#444;font-weight:500">${v}</span>`).join('')}
        </div>
        <div style="font-size:8px;color:#666;margin-top:6px;line-height:1.35;max-width:80%">${D.desc}</div>
        ${address('#999')}
      </div>
      <div style="position:absolute;bottom:-1px;left:50%;transform:translateX(-50%);width:74%;height:55%;border-radius:999px 999px 0 0;overflow:hidden;z-index:1">
        <img src="${PHOTO}" alt="" style="width:100%;height:100%;object-fit:cover;display:block">
        <div style="position:absolute;left:0;right:0;bottom:0;height:60%;background:linear-gradient(to top,rgba(0,0,0,0.6),transparent);pointer-events:none"></div>
      </div>
    </div>`,

  Split: `
    <div style="display:flex;width:100%;height:100%">
      <div style="width:50%;background:${AC};padding:5%;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden">
        <div>
          ${badge('blue', 'background:rgba(255,255,255,0.2);margin-bottom:6px')}
          <div style="font-size:20px;font-weight:700;color:#fff;margin-top:4px">${D.price}</div>
        </div>
        <div>
          <div style="font-size:14px;font-weight:600;color:#fff;line-height:1.3">${D.title}</div>
          <div style="margin-top:4px">${address()}</div>
          <div style="width:100%;height:1px;background:rgba(255,255,255,0.2);margin:6px 0"></div>
          <div style="font-size:8px;color:rgba(255,255,255,0.7);line-height:1.4">${D.desc}</div>
        </div>
        ${splitPills()}
      </div>
      <div style="width:50%;position:relative">
        <img src="${PHOTO}" alt="" style="width:100%;height:100%;object-fit:cover;display:block">
        <div style="position:absolute;top:0;left:0;width:2px;height:100%;background:${AC}"></div>
      </div>
    </div>`,
};

const grid = document.getElementById('grid');
Object.entries(templates).forEach(([name, html]) => {
  const wrap = document.createElement('div');
  wrap.className = 'tpl-wrap';
  wrap.innerHTML = `
    <div class="tpl-card">${html}</div>
    <div class="tpl-label">${name}</div>
  `;
  grid.appendChild(wrap);
});
</script>
</body>
</html>
