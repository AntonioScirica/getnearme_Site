<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light only">
<meta name="supported-color-schemes" content="light only">
<title>Richiesta supporto · GetNearMe</title>
</head>
<body style="margin:0;padding:0;background:#f4f5f7;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f5f7;padding:24px 16px;">
    <tr><td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:640px;background:#ffffff;border:1px solid #e5e7eb;border-radius:10px;">

        <tr>
          <td style="padding:20px 24px 8px;">
            <span style="display:inline-block;padding:3px 10px;border-radius:14px;background:#eef2ff;color:#3730a3;font-size:12px;font-weight:600;letter-spacing:0.3px;">SUPPORTO</span>
            <h1 style="margin:10px 0 4px;font-size:18px;color:#1F2937;font-weight:600;">Nuova richiesta · {{type_label}}</h1>
            <p style="margin:0;font-size:13px;color:#6b7280;">Ricevuta {{timestamp}}</p>
          </td>
        </tr>

        <tr>
          <td style="padding:8px 24px 4px;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="border:1px solid #e5e7eb;border-radius:8px;">
              <tr><td style="padding:10px 14px;background:#f9fafb;width:140px;font-size:13px;color:#6b7280;border-bottom:1px solid #e5e7eb;">Nome</td><td style="padding:10px 14px;font-size:13px;color:#1F2937;border-bottom:1px solid #e5e7eb;">{{user_name}}</td></tr>
              <tr><td style="padding:10px 14px;background:#f9fafb;font-size:13px;color:#6b7280;border-bottom:1px solid #e5e7eb;">Email</td><td style="padding:10px 14px;font-size:13px;color:#1F2937;border-bottom:1px solid #e5e7eb;">{{user_email}}</td></tr>
              <tr><td style="padding:10px 14px;background:#f9fafb;font-size:13px;color:#6b7280;border-bottom:1px solid #e5e7eb;">User ID</td><td style="padding:10px 14px;font-size:12px;color:#1F2937;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;border-bottom:1px solid #e5e7eb;">{{user_id}}</td></tr>
              <tr><td style="padding:10px 14px;background:#f9fafb;font-size:13px;color:#6b7280;">Tipo</td><td style="padding:10px 14px;font-size:13px;color:#1F2937;">{{type_label}}</td></tr>
            </table>
          </td>
        </tr>

        <tr>
          <td style="padding:16px 24px 8px;">
            <p style="margin:0 0 8px;font-size:13px;color:#6b7280;font-weight:600;text-transform:uppercase;letter-spacing:0.4px;">Messaggio</p>
            <div style="background:#f9fafb;border:1px solid #e5e7eb;border-radius:8px;padding:14px 16px;font-size:14px;line-height:1.6;color:#1F2937;white-space:pre-wrap;">{{message}}</div>
          </td>
        </tr>

        <tr>
          <td style="padding:8px 24px 22px;font-size:12px;color:#9ca3af;">
            Risposta diretta all'utente: il campo Reply-To è già impostato su <strong>{{user_email}}</strong>.
          </td>
        </tr>

      </table>
    </td></tr>
  </table>
</body>
</html>
