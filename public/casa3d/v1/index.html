<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Casa 3D</title>
<meta name="robots" content="noindex">
<script type="importmap">
{ "imports": { "three": "./vendor/three/build/three.module.js", "three/addons/": "./vendor/three/addons/" } }
</script>
<style>
  /* Casa 3D di Agente Immo: visore a schermo intero (pagina /a/<sito>/<immobile>/3d, incorporabile in altri siti).
     Parametri: src = elenco dei piani (JSON { floors: [{ name, plan, image }] }) oppure plan = una pianta;
     floor, view (top|walk), time (day|night), ui=0, poster=1 (manda al genitore la vista dall'alto come immagine). */
  :root { --ink: #1d1d1b; --glass: rgba(255, 255, 255, 0.84); --brand: #537eec; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #eceae6; font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: var(--ink); overflow: hidden; -webkit-tap-highlight-color: transparent; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  .glass { background: var(--glass); backdrop-filter: blur(16px) saturate(1.4); -webkit-backdrop-filter: blur(16px) saturate(1.4); box-shadow: 0 8px 32px rgba(0,0,0,.14); }
  .bar { position: fixed; left: 50%; bottom: max(16px, env(safe-area-inset-bottom)); transform: translateX(-50%); display: flex; gap: 8px; padding: 8px; border-radius: 24px; z-index: 5; flex-wrap: nowrap; }
  .seg { display: flex; background: rgba(0,0,0,.05); border-radius: 16px; padding: 4px; gap: 2px; }
  button { appearance: none; border: 0; background: transparent; font: 600 14px/1 inherit; font-family: inherit; color: #4a4a46; padding: 10px 14px; border-radius: 12px; cursor: pointer; white-space: nowrap; transition: background .6s, color .6s; }
  button.on { background: #fff; color: var(--ink); box-shadow: 0 1px 4px rgba(0,0,0,.12); }
  .toggle.on { background: var(--ink); color: #fff; }
  .floors { position: fixed; top: max(12px, env(safe-area-inset-top)); left: 12px; z-index: 6; display: flex; gap: 2px; padding: 4px; border-radius: 16px; max-width: calc(100vw - 160px); overflow-x: auto; }
  .floors[hidden] { display: none; }
  .floors button { padding: 9px 12px; font-size: 13px; }
  .floors button.on { background: var(--brand); color: #fff; box-shadow: none; }
  .v3d-label { background: rgba(255,255,255,.9); backdrop-filter: blur(8px); border-radius: 12px; padding: 6px 10px; font-size: 12px; line-height: 1.25; text-align: center; box-shadow: 0 2px 10px rgba(0,0,0,.12); transition: opacity .6s; }
  .v3d-label b { display: block; font-size: 13px; }
  .v3d-label span { color: #6b6b66; }
  .v3d-joy { position: absolute; left: 32px; bottom: 120px; width: 112px; height: 112px; border-radius: 56px; background: rgba(255,255,255,.28); border: 1.5px solid rgba(255,255,255,.7); backdrop-filter: blur(6px); z-index: 4; pointer-events: none; }
  .v3d-joy-knob { position: absolute; left: 32px; top: 32px; width: 48px; height: 48px; border-radius: 24px; background: rgba(255,255,255,.92); box-shadow: 0 2px 8px rgba(0,0,0,.2); }
  .hint { position: fixed; bottom: calc(max(16px, env(safe-area-inset-bottom)) + 72px); left: 50%; transform: translateX(-50%); padding: 8px 16px; border-radius: 16px; font-size: 13px; color: #45453f; z-index: 5; transition: opacity .6s; white-space: nowrap; }
  .loading { position: fixed; inset: 0; display: grid; place-items: center; background: #eceae6; z-index: 10; transition: opacity .6s; }
  .loading div { font-size: 15px; color: #555; text-align: center; }
  .loading i { display: block; height: 4px; width: 240px; background: rgba(0,0,0,.08); border-radius: 2px; margin-top: 16px; overflow: hidden; }
  .loading i b { display: block; height: 100%; width: 0; background: var(--brand); transition: width .6s; }
  .err { position: fixed; inset: 0; display: none; place-items: center; z-index: 11; background: #eceae6; font-size: 15px; color: #555; padding: 24px; text-align: center; }
  .orig { position: fixed; top: max(12px, env(safe-area-inset-top)); right: 12px; z-index: 7; width: 168px; padding: 8px; background: #fff; border-radius: 24px; box-shadow: 0 8px 28px rgba(0,0,0,.14); cursor: zoom-in; transition: width .6s cubic-bezier(.22,1,.36,1); display: none; }
  .orig img { display: block; width: 100%; border-radius: 16px; }
  .orig span { display: block; font: 600 11px inherit; font-family: inherit; color: #6a6a6a; padding: 6px 4px 0; }
  .orig.big { width: min(640px, 90vw); cursor: zoom-out; }
  .fps { position: fixed; bottom: 12px; right: 12px; font: 600 12px ui-monospace, monospace; background: rgba(0,0,0,.55); color: #fff; padding: 4px 8px; border-radius: 8px; z-index: 6; display: none; }
  body.noui .bar, body.noui .hint, body.noui .floors, body.noui .orig { display: none !important; }
  @media (max-width: 560px) { .orig { width: 96px; padding: 6px; border-radius: 16px; } .orig span { display: none; } .bar { gap: 4px; padding: 6px; border-radius: 20px; } .bar button { padding: 9px 10px; font-size: 13px; } .hint { font-size: 12px; } }
  @media (max-width: 420px) { .bar { max-width: calc(100vw - 16px); } .seg { padding: 3px; } .bar button { padding: 8px 8px; font-size: 12px; } .hint { display: none; } }
</style>
</head>
<body>
<div id="app"></div>
<div class="loading" id="loading"><div><span id="ltxt">Sto costruendo la casa</span><i><b id="lbar"></b></i></div></div>
<div class="err" id="err">La casa 3D non si apre, riprova tra poco.</div>
<div class="floors glass" id="floors" hidden></div>
<div class="hint glass" id="hint">Tocca una stanza per entrarci</div>
<div class="fps" id="fps"></div>
<div class="orig" id="orig" title="Planimetria"><img id="origImg" alt="Planimetria"><span>Planimetria, tocca per ingrandire</span></div>
<div class="bar glass" id="bar">
  <div class="seg"><button data-view="top" class="on">Dall'alto</button><button data-view="walk">Cammina</button></div>
  <div class="seg"><button data-time="day" class="on">Giorno</button><button data-time="night">Notte</button></div>
  <button class="toggle on" id="furn">Arredata</button>
</div>
<script type="module">
import { createViewer } from './viewer/viewer.js'
const q = new URLSearchParams(location.search)
const $ = s => document.querySelector(s)
const ASSETS = q.get('assets') || 'https://pub-a668674eaa484e8e8f2f10c264392bfc.r2.dev/casa3d-assets/v1'
const touch = 'ontouchstart' in window
const hints = { top: touch ? 'Tocca una stanza per entrarci' : 'Clicca una stanza per entrarci', walk: touch ? 'Joystick per camminare, trascina per guardarti intorno' : 'WASD per camminare, trascina per guardare, doppio clic per andare' }
const poster = q.get('poster') === '1'
if (q.get('ui') === '0' || poster) document.body.classList.add('noui')
if (q.get('fps')) $('#fps').style.display = 'block'
// solo indirizzi https (o del sito stesso): niente javascript: o dati strani dal parametro
const safe = u => { try { const x = new URL(u, location.href); return x.protocol === 'https:' || x.origin === location.origin ? x.href : null } catch { return null } }

let floors = []
try {
  if (q.get('src') && safe(q.get('src'))) floors = (await (await fetch(safe(q.get('src')))).json()).floors ?? []
  else if (q.get('plan') && safe(q.get('plan'))) floors = [{ name: '', plan: safe(q.get('plan')) }]
} catch { floors = [] }
floors = floors.filter(f => f && safe(f.plan))
if (!floors.length) { $('#loading').remove(); $('#err').style.display = 'grid'; throw new Error('nessuna pianta') }

let v = null, cur = -1, busy = false
const state = { view: q.get('view') || 'top', time: q.get('time') || 'day', furnished: q.get('arredata') !== '0' }
const sync = () => {
  if (!v) return
  const s = v.state
  state.view = s.view; state.furnished = s.furnished
  document.querySelectorAll('[data-view]').forEach(b => b.classList.toggle('on', b.dataset.view === s.view))
  document.querySelectorAll('[data-time]').forEach(b => b.classList.toggle('on', (b.dataset.time === 'night') === s.night))
  $('#furn').classList.toggle('on', s.furnished); $('#furn').textContent = s.furnished ? 'Arredata' : 'Vuota'
  $('#hint').textContent = hints[s.view]
  document.querySelectorAll('[data-floor]').forEach(b => b.classList.toggle('on', +b.dataset.floor === cur))
}
async function open(i) {
  if (busy || i === cur) return
  busy = true
  const f = floors[i]
  const ld = document.createElement('div'); ld.className = 'loading'; ld.innerHTML = '<div><span>Sto costruendo la casa</span><i><b></b></i></div>'
  if (!$('#loading')) { ld.id = 'loading'; document.body.appendChild(ld) }
  const bar = $('#loading b')
  try {
    v?.dispose(); v = null
    $('#app').innerHTML = ''
    v = await createViewer($('#app'), {
      planUrl: f.plan, assetsBase: ASSETS, view: 'top', time: state.time, furnished: state.furnished, quality: q.get('q') || 'auto',
      onProgress: p => { if (bar) bar.style.width = `${p * 100}%` }, onFps: x => { $('#fps').textContent = `${Math.round(x)} fps` },
    })
    window.viewer = v
    cur = i
    if (f.image && safe(f.image)) { $('#origImg').src = safe(f.image); $('#orig').style.display = 'block' } else $('#orig').style.display = 'none'
    const origEnter = v.enterRoom; v.enterRoom = id => { origEnter(id); sync() }
    if (state.view === 'walk' && !poster) v.setView('walk')
    const l = $('#loading'); if (l) { l.style.opacity = 0; setTimeout(() => l.remove(), 700) }
    sync()
    if (poster) {
      // vista dall'alto per il poster dell'immobile: si aspetta che le texture siano su e l'animazione ferma
      setTimeout(() => {
        try { parent.postMessage({ casa3dPoster: v.snapshot('image/jpeg', 0.86), floor: i }, '*') } catch {}
      }, 1800)
    }
  } catch (e) {
    console.error(e); $('#loading')?.remove(); $('#err').style.display = 'grid'
  }
  busy = false
}
if (floors.length > 1) {
  const box = $('#floors'); box.hidden = false
  floors.forEach((f, i) => { const b = document.createElement('button'); b.dataset.floor = i; b.textContent = f.name || `Piano ${i + 1}`; b.onclick = () => open(i); box.appendChild(b) })
}
$('#orig').onclick = () => $('#orig').classList.toggle('big')
document.querySelectorAll('[data-view]').forEach(b => b.onclick = () => { v?.setView(b.dataset.view); sync() })
document.querySelectorAll('[data-time]').forEach(b => b.onclick = () => { state.time = b.dataset.time; v?.setTime(b.dataset.time); sync() })
$('#furn').onclick = () => { v?.setFurnished(!v.state.furnished); sync() }
setInterval(sync, 500)
await open(Math.min(floors.length - 1, Math.max(0, +(q.get('floor') || 0))))
</script>
</body>
</html>
